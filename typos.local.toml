# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]

[patterns]
# The standard terminal-colour environment variable is an external API.
# The vendored uv_gate.py lists uv's short flags (-U, -P, -n) as the string
# "UPn"; the file is byte-for-byte canonical, so exempt that one line.
ignore = ['\bNO_COLOR\b', '(?m)^FORBIDDEN_SHORT = "UPn"$']
markdown_only = [
  # Inline code spans were masked by the previous dictionary snapshot; kept
  # until the shared dictionary rules on it.
  '`[^`\n]+`',
]

[files]
exclude = []
