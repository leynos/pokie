name: Act Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  act-validation:
    runs-on: ubuntu-latest
    env:
      ACT_VERSION: v0.2.89
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Install act
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          act_archive=act_Linux_x86_64.tar.gz
          act_url="https://github.com/nektos/act/releases/download/${ACT_VERSION}/${act_archive}"
          curl -fsSLo "${act_archive}" "${act_url}"
          act_sha256="$(
            curl -fsSL --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/nektos/act/releases/tags/${ACT_VERSION}" |
              jq -r --arg archive "${act_archive}" \
                '.assets[] | select(.name == $archive) | .digest | ltrimstr("sha256:")'
          )"
          printf '%s  %s\n' "${act_sha256}" "${act_archive}" | sha256sum -c -
          sudo tar -xzf "${act_archive}" -C /usr/local/bin act

      - name: Check Docker runtime
        run: docker info

      - name: Exercise wheel action with act
        run: make test-act
