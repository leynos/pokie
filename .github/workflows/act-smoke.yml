name: Pure wheel smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4
        with:
          persist-credentials: false
      - name: Build pure wheel
        uses: ./.github/actions/pure-python-wheel
        with:
          python-version: '3.14'
          artifact-name: wheels-smoke
          upload-artefact: 'false'
      - name: Import built package
        run: |
          uv venv smoke-env --python 3.14
          uv pip install --python smoke-env/bin/python dist/*.whl
          cd dist
          ../smoke-env/bin/python ../.github/actions/pure-python-wheel/scripts/smoke.py
